<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Frame</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; font-family:system-ui,sans-serif; color:#fff; }
  @font-face { font-family:'Geist Mono'; font-weight:600; font-display:swap; src:url(https://cdn.jsdelivr.net/gh/bothuany/ascii-animals@6a887d0b6693c357c44daa653b1a875951b6319a/fonts/GeistMono-SemiBold.ttf) format('truetype'); }
  html,body { background:rgb(6,7,12); }
  canvas { position:fixed; inset:0; width:100%; height:100%; }
  #bg { font-family:'Geist Mono', ui-monospace, Menlo, monospace; }
  #c { visibility:hidden; }
  video { display:none; }
  #msg { position:fixed; inset:0; display:grid; place-items:center; text-align:center; z-index:3; padding:24px; }
  #msg button { font:inherit; font-size:16px; padding:12px 22px; border:0; border-radius:999px; background:#d4ff00; color:#111; cursor:pointer; }
  #hint { position:fixed; left:0; right:0; bottom:16px; text-align:center; font-size:13px; opacity:.8; z-index:2; pointer-events:none; text-shadow:0 1px 4px #000; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>
<div id="msg"><button id="start">start camera</button></div>
<div id="hint"></div>

<script src="https://cdn.jsdelivr.net/gh/bothuany/ascii-animals@6a887d0b6693c357c44daa653b1a875951b6319a/engine.js"></script>
<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ---- settings -------------------------------------------------------
const CELL = 14;                 // grid size in css px
const PINK_HOT = "#ff4fc3", PINK_PALE = "#ffc4ec", INK = "#1a0a14", LIME = "#d4ff00";
const MIRROR = true;
// ---------------------------------------------------------------------

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const v = document.getElementById("v"), hint = document.getElementById("hint"), msg = document.getElementById("msg");
const tmp = document.createElement("canvas"), tctx = tmp.getContext("2d", { willReadFrequently: true });
let dpr = 1, W = 0, H = 0, landmarker = null, lastTs = -1;
let quad = null, alpha = 0;      // smoothed corner points + fade

// ---- animal background on the home screen (engine by bothuany/ascii-animals) ----
let bgEngine = null;
(function startAnimals() {
  const bg = document.getElementById("bg");
  if (!window.AsciiAnimals) return;
  const q = new URLSearchParams(location.search);              // ?animal=koi to force one
  const list = AsciiAnimals.ANIMALS;
  const animal = list.includes(q.get("animal")) ? q.get("animal") : list[Math.floor(Math.random() * list.length)];
  const go = () => { bgEngine = AsciiAnimals.start(bg, AsciiAnimals.fromQuery("animal=" + animal)); };
  document.fonts.load('600 16px "Geist Mono"').then(go, go);
})();

function fit() { dpr = devicePixelRatio || 1; W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; }
addEventListener("resize", fit); fit();

// video -> canvas mapping (cover fit, mirrored)
function cover() {
  const vw = v.videoWidth, vh = v.videoHeight, s = Math.max(W / vw, H / vh);
  return { s, dx: (W - vw * s) / 2, dy: (H - vh * s) / 2, vw, vh };
}
function mapPt(p, m) {
  const x = (MIRROR ? 1 - p.x : p.x) * m.vw * m.s + m.dx;
  return { x, y: p.y * m.vh * m.s + m.dy };
}

function drawVideo(m) {
  ctx.save();
  if (MIRROR) { ctx.translate(W, 0); ctx.scale(-1, 1); }
  const dx = MIRROR ? W - (m.dx + m.vw * m.s) : m.dx;
  ctx.drawImage(v, dx, m.dy, m.vw * m.s, m.vh * m.s);
  ctx.restore();
}

function drawDots(c) {
  ctx.fillStyle = "rgba(0,0,0,.55)";
  for (let y = c / 2; y < H; y += c) for (let x = c / 2; x < W; x += c) ctx.fillRect(x - 1, y - 1, 2 * dpr, 2 * dpr);
}

// order 4 points around their centre so the polygon doesn't self-intersect
function orderQuad(pts) {
  const cx = pts.reduce((a, p) => a + p.x, 0) / 4, cy = pts.reduce((a, p) => a + p.y, 0) / 4;
  return pts.slice().sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
}

function findQuad(res, m) {
  if (!res.landmarks || res.landmarks.length < 2) return null;
  const pts = [];
  for (const hand of res.landmarks.slice(0, 2)) {
    pts.push(mapPt(hand[4], m));   // thumb tip
    pts.push(mapPt(hand[8], m));   // index tip
  }
  return orderQuad(pts);
}

function level(l) { return l < 0.28 ? 0 : l < 0.5 ? 1 : l < 0.74 ? 2 : 3; }

function drawAsciiInQuad(q, c, a) {
  // sample the already-drawn video at grid resolution
  const cols = Math.ceil(W / c), rows = Math.ceil(H / c);
  tmp.width = cols; tmp.height = rows;
  tctx.drawImage(cv, 0, 0, cols, rows);
  const px = tctx.getImageData(0, 0, cols, rows).data;
  const lv = new Uint8Array(cols * rows);
  for (let i = 0; i < cols * rows; i++) {
    let l = (0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]) / 255;
    lv[i] = level(Math.min(1, Math.max(0, (l - 0.08) * 1.3)));
  }

  ctx.save();
  ctx.globalAlpha = a;
  ctx.beginPath(); q.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath();
  ctx.clip();

  // bounding box of the quad -> only loop cells we need
  const x0 = Math.max(0, Math.floor(Math.min(...q.map(p => p.x)) / c)), x1 = Math.min(cols - 1, Math.floor(Math.max(...q.map(p => p.x)) / c));
  const y0 = Math.max(0, Math.floor(Math.min(...q.map(p => p.y)) / c)), y1 = Math.min(rows - 1, Math.floor(Math.max(...q.map(p => p.y)) / c));

  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const L = lv[y * cols + x], px_ = x * c, py = y * c, cx = px_ + c / 2, cy = py + c / 2;
    ctx.fillStyle = L < 2 ? PINK_HOT : PINK_PALE;
    ctx.fillRect(px_, py, c + 1, c + 1);
    ctx.strokeStyle = ctx.fillStyle = INK;
    ctx.lineWidth = Math.max(1, dpr);
    if (L === 0) {                                   // ◎
      ctx.beginPath(); ctx.arc(cx, cy, c * 0.36, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, c * 0.17, 0, 7); ctx.fill();
    } else if (L === 1) {                            // ✦ / +
      const r = c * 0.3;
      ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
      ctx.moveTo(cx - r * .6, cy - r * .6); ctx.lineTo(cx + r * .6, cy + r * .6); ctx.moveTo(cx + r * .6, cy - r * .6); ctx.lineTo(cx - r * .6, cy + r * .6);
      ctx.stroke();
    } else if (L === 2) {                            // □
      const r = c * 0.28; ctx.strokeRect(cx - r, cy - r, r * 2, r * 2);
    } else {                                         // small □, faint
      const r = c * 0.18; ctx.globalAlpha = a * 0.6; ctx.strokeRect(cx - r, cy - r, r * 2, r * 2); ctx.globalAlpha = a;
    }
  }

  // lime outline where dark meets light
  ctx.strokeStyle = LIME; ctx.lineWidth = 3 * dpr; ctx.lineCap = "round";
  ctx.beginPath();
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const L = lv[y * cols + x] < 2;
    if (x < cols - 1 && L !== (lv[y * cols + x + 1] < 2)) { ctx.moveTo((x + 1) * c, y * c); ctx.lineTo((x + 1) * c, (y + 1) * c); }
    if (y < rows - 1 && L !== (lv[(y + 1) * cols + x] < 2)) { ctx.moveTo(x * c, (y + 1) * c); ctx.lineTo((x + 1) * c, (y + 1) * c); }
  }
  ctx.stroke();
  ctx.restore();
}

function drawCorners(q, a) {
  ctx.save(); ctx.globalAlpha = a;
  for (const p of q) {
    ctx.beginPath(); ctx.arc(p.x, p.y, 9 * dpr, 0, 7);
    ctx.fillStyle = LIME; ctx.fill(); ctx.lineWidth = 3 * dpr; ctx.strokeStyle = "#000"; ctx.stroke();
  }
  ctx.restore();
}

function frame() {
  requestAnimationFrame(frame);
  if (v.readyState < 2) return;
  const m = cover(), c = CELL * dpr;
  drawVideo(m);

  let target = null;
  if (landmarker && v.currentTime !== lastTs) {
    lastTs = v.currentTime;
    target = findQuad(landmarker.detectForVideo(v, performance.now()), m);
  }
  if (target) {
    quad = quad ? quad.map((p, i) => ({ x: p.x + (target[i].x - p.x) * 0.5, y: p.y + (target[i].y - p.y) * 0.5 })) : target;
    alpha = Math.min(1, alpha + 0.2);
  } else alpha = Math.max(0, alpha - 0.08);

  drawDots(c);
  if (quad && alpha > 0.01) { drawAsciiInQuad(quad, c, alpha); drawCorners(quad, alpha); }
  hint.textContent = landmarker ? (alpha > 0.01 ? "" : "make an L with each thumb and index finger and frame your face") : "loading hand tracking...";
}

document.getElementById("start").onclick = async () => {
  try {
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 1280, height: 720 }, audio: false });
    await v.play();
    msg.remove();
    if (bgEngine) bgEngine.destroy();
    document.getElementById("bg").remove();
    cv.style.visibility = "visible";
    frame();
    const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
      runningMode: "VIDEO", numHands: 2
    });
  } catch (e) {
    msg.innerHTML = "<div>Error: " + (e.name || "") + " " + (e.message || e) + "<br>Allow camera access and open over https.</div>";
  }
};
</script>
</body>
</html>
